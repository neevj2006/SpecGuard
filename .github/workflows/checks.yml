name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --locked
      - run: npm run check
      - run: npm run build --workspace @specguard/web
      - run: npm audit --omit=dev --audit-level=high
      - run: uv run pip-audit --progress-spinner off
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: specguard
          POSTGRES_PASSWORD: specguard-test
          POSTGRES_DB: specguard_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U specguard -d specguard_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPECGUARD_DATABASE_URL: postgresql+psycopg://specguard:specguard-test@localhost:5432/specguard_test
      TEST_POSTGRES_URL: postgresql+psycopg://specguard:specguard-test@localhost:5432/specguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/test_postgres.py -q
