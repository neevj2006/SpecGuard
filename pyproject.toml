[project]
name = "specguard"
version = "0.1.0"
description = "Evidence-grounded requirement review for TypeScript pull requests"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
specguard = "services.analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
